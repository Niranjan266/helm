<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 48 48" fill="none">
  <!-- Helm app icon: the website's Helm mark in pencil yellow on a blueprint tile.
       render-icon.ps1 draws exactly this (GDI+) to app-icon.png. -->
  <rect x="1" y="1" width="46" height="46" rx="10" fill="#0d3a86"/>
  <g transform="translate(24 24) scale(0.78) translate(-24 -24)" color="#ffd84d">
    <rect x="6" y="6" width="7" height="36" rx="3.5" fill="currentColor"/>
    <rect x="35" y="6" width="7" height="36" rx="3.5" fill="currentColor"/>
    <g stroke="currentColor" stroke-width="3" stroke-linecap="round">
      <circle cx="24" cy="24" r="7.5"/>
      <line x1="13" y1="24" x2="16.5" y2="24"/>
      <line x1="31.5" y1="24" x2="35" y2="24"/>
      <line x1="24" y1="13" x2="24" y2="16.5"/>
      <line x1="24" y1="31.5" x2="24" y2="35"/>
    </g>
    <circle cx="24" cy="24" r="2.2" fill="currentColor"/>
    <circle cx="24" cy="11" r="2.2" fill="currentColor"/>
    <circle cx="24" cy="37" r="2.2" fill="currentColor"/>
  </g>
</svg>
