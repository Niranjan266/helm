[package]
name = "helm-desktop"
version = "0.4.2"
edition = "2024"
description = "Helm for Windows: desktop window + tray that runs the Helm agent in-process"
license = "MIT"
publish = false

[[bin]]
name = "Helm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
helm-agent = { path = "../agent" }
helm-win-apps = { path = "../crates/helm-win-apps" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["full"] }
anyhow = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true

# Same as host/agent: the Opus codec is far too slow unoptimised (profiles only apply at the
# build root).
[profile.dev.package.unsafe-libopus]
opt-level = 3
overflow-checks = false
debug-assertions = false
