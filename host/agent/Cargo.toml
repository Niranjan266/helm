[package]
name = "helm-agent"
version = "0.1.0"
edition = "2024"
description = "Helm PC agent: lets a paired Android phone control this Windows PC"
license = "MIT"

[lib]
name = "helm_agent"
path = "src/lib.rs"

[[bin]]
name = "helm-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.22"
futures-util = { version = "0.3.34", features = ["sink"] }
hex = "0.4.3"
hostname = "0.4.2"
if-addrs = "0.15"
mdns-sd = "0.21.6"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
subtle = "2.6"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
tempfile = "3.27.0"
