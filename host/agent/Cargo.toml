[package]
name = "helm-agent"
version = "0.5.0"
edition = "2024"
description = "Helm PC agent: lets a paired Android phone control this Windows PC"
license = "MIT"

[lib]
name = "helm_agent"
path = "src/lib.rs"

[[bin]]
name = "helm-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.22"
futures-util = { version = "0.3.34", features = ["sink"] }
hex = "0.4.3"
hostname = "0.4.2"
if-addrs = "0.15"
mdns-sd = "0.21.6"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
subtle = "2.6"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }
webpki-roots = "1.0.11"
helm-win-apps = { path = "../crates/helm-win-apps" }
helm-win-input = { path = "../crates/helm-win-input" }
helm-win-system = { path = "../crates/helm-win-system" }
helm-update = { path = "../crates/helm-update" }
helm-win-sysmon = { path = "../crates/helm-win-sysmon" }
# Phase 5
helm-win-record = { path = "../crates/helm-win-record" }
helm-win-terminal = { path = "../crates/helm-win-terminal" }
helm-win-pen = { path = "../crates/helm-win-pen" }
helm-win-notify = { path = "../crates/helm-win-notify" }
helm-plugins = { path = "../crates/helm-plugins" }
# g6 (clipboard-history thumbnails)
png = "0.18"

[target.'cfg(windows)'.dependencies]
helm-win-capture = { path = "../crates/helm-win-capture" }
helm-win-audio = { path = "../crates/helm-win-audio" }
tray-icon = { version = "0.25.1", default-features = false }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_NetworkManagement_WiFi",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # g6
    "ApplicationModel",
    "Foundation_Collections",
    "UI_Notifications_Management",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Performance",
] }

[dev-dependencies]
tempfile = "3.27.0"
wat = "1"

# helm-win-audio's Opus codec (c2rust-translated libopus) is ~10x slower unoptimised and relies
# on wrapping arithmetic; profiles only apply at the build root (see that crate's README).
[profile.dev.package.unsafe-libopus]
opt-level = 3
overflow-checks = false
debug-assertions = false
