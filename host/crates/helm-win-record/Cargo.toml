[package]
name = "helm-win-record"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Helm: MP4 recording of H.264 access units + PCM audio (AAC) with the Media Foundation sink writer"
license = "MIT"
publish = false

[lib]
name = "helm_win_record"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[dev-dependencies]
serde_json = "1.0.154"
