[package]
name = "helm-win-pen"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Helm: pen (stylus) injection with pressure, tilt and eraser via Windows synthetic pointer devices"
license = "MIT"
publish = false

[lib]
name = "helm_win_pen"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_Controls",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json = "1.0.154"
