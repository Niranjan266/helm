[package]
name = "helm-win-terminal"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Helm: Windows pseudo-console (ConPTY) terminal sessions for cmd.exe / PowerShell"
license = "MIT"
publish = false

[lib]
name = "helm_win_terminal"
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
