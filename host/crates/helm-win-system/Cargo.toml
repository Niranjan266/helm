[package]
name = "helm-win-system"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Helm: Windows system integration (media, volume, brightness, power, network, OS info)"
license = "MIT"
publish = false

[lib]
name = "helm_win_system"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
# windows-core is needed by the #[implement] macro (COM callbacks).
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    # WinRT
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Graphics_Imaging",
    # Win32 basics / COM
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Rpc",
    # Core Audio
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    # Brightness: WMI (internal panels) + DDC/CI (external monitors)
    "Win32_System_Wmi",
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    # Power
    "Win32_System_Shutdown",
    "Win32_System_Power",
    "Win32_Security",
    "Win32_System_Threading",
    # Network adapters
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    # OS info
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
serde_json = "1.0.154"
