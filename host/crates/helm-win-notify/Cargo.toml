[package]
name = "helm-win-notify"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Helm: Windows toast notifications (title, body, image, buttons, reply box) for an unpackaged app"
license = "MIT"
publish = false

[lib]
name = "helm_win_notify"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Security",
    "Win32_System_Registry",
] }

[dev-dependencies]
serde_json = "1.0.154"
